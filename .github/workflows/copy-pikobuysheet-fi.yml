name: Copy pikobuysheet-fi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy project from source repository
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/zhoucanqiang35-art/new.git /tmp/source-project
          git -C /tmp/source-project sparse-checkout set pikobuysheet-fi
          rm -rf pikobuysheet-fi
          cp -a /tmp/source-project/pikobuysheet-fi ./pikobuysheet-fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pikobuysheet-fi
          git diff --cached --quiet && exit 0
          git commit -m 'Copy pikobuysheet.fi from new repository'
          git push
